[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-gov"
version = "0.5.0"
description = "AI Agent Cost Governance Platform — reverse proxy that tracks, budgets, and controls AI agent spending"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "agents", "cost", "governance", "budget", "proxy"]
authors = [
    {name = "MAAGZ Dev", email = "maagz@maagz.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "aiosqlite>=0.19.0",
    "jinja2>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/maagz/agent-gov"
"Bug Reports" = "https://github.com/maagz/agent-gov/issues"
"Source" = "https://github.com/maagz/agent-gov"

[project.scripts]
agent-gov = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "database", "cli"]
