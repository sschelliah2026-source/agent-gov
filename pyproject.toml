[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gov-saas"
version = "0.6.0"
description = "AI Agent Cost Governance — policy engine, budget enforcement, per-tool cost tracking, multi-tenant workspaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"

authors = [
    {name = "MAAGZ Dev", email = "sschelliah2026@gmail.com"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.24.0",
    "jinja2>=3.0.0",
    "aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/sschelliah2026-source/agent-gov"
Repository = "https://github.com/sschelliah2026-source/agent-gov"
Documentation = "https://github.com/sschelliah2026-source/agent-gov#readme"

[project.scripts]
agent-gov = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
py-modules = ["app", "database", "cli", "seed_tools"]
