<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <style>
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="38" fill="white" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">How Budget Enforcement Works</text>
  <line x1="310" y1="52" x2="690" y2="52" stroke="#334155" stroke-width="1"/>

  <!-- Tool Registry (left side badge) -->
  <rect x="55" y="100" width="140" height="70" rx="8" fill="rgba(120, 53, 15, 0.25)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="125" y="125" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">TOOL REGISTRY</text>
  <text x="125" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">gpt-4: $12.50</text>
  <text x="125" y="157" fill="#94a3b8" font-size="9" text-anchor="middle">gpt-3.5: $0.50</text>

  <!-- Agent box -->
  <rect x="55" y="190" width="220" height="80" rx="10" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="2"/>
  <text x="165" y="222" fill="white" font-size="13" font-weight="600" text-anchor="middle">AI Agent</text>
  <text x="165" y="242" fill="#94a3b8" font-size="10" text-anchor="middle">"Call gpt-4 for summary"</text>
  <text x="165" y="258" fill="#64748b" font-size="9" text-anchor="middle">Estimated cost: $0.50</text>

  <!-- Arrow Agent → Gate -->
  <line x1="275" y1="230" x2="385" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="220" fill="#64748b" font-size="9">POST /proxy/call</text>

  <!-- Gate box -->
  <rect x="395" y="80" width="280" height="200" rx="12" fill="rgba(6, 78, 59, 0.12)" stroke="#34d399" stroke-width="2"/>
  <text x="535" y="108" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">agent-gov Proxy Gate</text>
  <line x1="415" y1="116" x2="655" y2="116" stroke="#34d399" stroke-width="0.5" opacity="0.4"/>

  <!-- Step 1 -->
  <rect x="420" y="130" width="230" height="36" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="535" y="147" fill="white" font-size="10" text-anchor="middle">1. Look up real cost</text>
  <text x="535" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">(registry overrides estimate)</text>

  <!-- Result badge -->
  <rect x="445" y="174" width="180" height="26" rx="5" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="535" y="192" fill="#fbbf24" font-size="10" text-anchor="middle">Real cost: $12.50 (not $0.50)</text>

  <!-- Step 2 -->
  <rect x="420" y="210" width="230" height="36" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="535" y="227" fill="white" font-size="10" text-anchor="middle">2. Check daily budget</text>
  <text x="535" y="240" fill="#94a3b8" font-size="8" text-anchor="middle">(spent $42.30 of $50.00)</text>

  <!-- Budget bar -->
  <rect x="460" y="250" width="150" height="10" rx="5" fill="#1e293b"/>
  <rect x="460" y="250" width="127" height="10" rx="5" fill="#fbbf24"/>
  <rect x="460" y="250" width="127" height="10" rx="5" fill="#34d399" opacity="0.3"/>
  <text x="535" y="270" fill="#a78bfa" font-size="8" text-anchor="middle">$42.30 used · 84.6% consumed</text>

  <!-- RESULTS SECTION -->
  <!-- Result 1: Approved -->
  <rect x="55" y="310" width="260" height="100" rx="10" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="2"/>
  <rect x="60" y="316" width="20" height="14" rx="3" fill="url(#green)"/>
  <text x="86" y="328" fill="#34d399" font-size="12" font-weight="600">APPROVED ✅</text>
  <text x="200" y="328" fill="#64748b" font-size="9">$12.50 deducted</text>
  <line x1="65" y1="340" x2="305" y2="340" stroke="#1e293b" stroke-width="0.5"/>
  <text x="185" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">Agent calls the real tool</text>
  <text x="185" y="374" fill="#22d3ee" font-size="9" text-anchor="middle">← Real cost logged to audit trail</text>
  <text x="185" y="390" fill="#34d399" font-size="9" text-anchor="middle">Budget auto-resets at midnight</text>

  <!-- Arrow Gate → Approved -->
  <path d="M 440 280 L 440 295 Q 440 303 185 303 L 185 308" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="340" y="296" fill="#34d399" font-size="9">Within budget</text>

  <!-- Result 2: Blocked -->
  <rect x="355" y="310" width="280" height="100" rx="10" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="2"/>
  <rect x="360" y="316" width="20" height="14" rx="3" fill="url(#red)"/>
  <text x="386" y="328" fill="#fb7185" font-size="12" font-weight="600">BLOCKED + PAUSED ⛔</text>
  <line x1="365" y1="340" x2="625" y2="340" stroke="#1e293b" stroke-width="0.5"/>
  <text x="495" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">Would exceed remaining $7.70 budget</text>
  <text x="495" y="374" fill="#fb7185" font-size="9" text-anchor="middle">→ Agent auto-paused immediately</text>
  <text x="495" y="390" fill="#fb7185" font-size="9" text-anchor="middle">→ Admin receives alert notification</text>
  <text x="495" y="404" fill="#64748b" font-size="8" text-anchor="middle">Resume: POST /agents/{key}/resume</text>

  <!-- Arrow Gate → Blocked -->
  <path d="M 535 280 L 535 308" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="540" y="298" fill="#fb7185" font-size="9">Over budget!</text>

  <!-- Result 3: Policy Redirect -->
  <rect x="680" y="310" width="260" height="100" rx="10" fill="rgba(120, 53, 15, 0.25)" stroke="#fbbf24" stroke-width="2"/>
  <rect x="685" y="316" width="20" height="14" rx="3" fill="url(#gold)"/>
  <text x="711" y="328" fill="#fbbf24" font-size="12" font-weight="600">POLICY REDIRECT ⚠</text>
  <line x1="690" y1="340" x2="930" y2="340" stroke="#1e293b" stroke-width="0.5"/>
  <text x="810" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">gpt-4 costs $12.50 (exceeds $5 policy)</text>
  <text x="810" y="374" fill="#fbbf24" font-size="9" text-anchor="middle">→ Falls back to gpt-3.5 ($0.50)</text>
  <text x="810" y="390" fill="#fbbf24" font-size="9" text-anchor="middle">→ Task completes at 4% of the cost</text>

  <!-- Arrow Gate → Policy -->
  <path d="M 630 280 L 630 295 Q 630 303 810 303 L 810 308" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="296" fill="#fbbf24" font-size="9">Policy blocks expensive</text>

  <!-- Legend -->
  <rect x="695" y="100" width="12" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="712" y="108" fill="#94a3b8" font-size="9">Approve</text>
  <rect x="695" y="116" width="12" height="10" rx="2" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="712" y="124" fill="#94a3b8" font-size="9">Block + Pause</text>
  <rect x="695" y="132" width="12" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="712" y="140" fill="#94a3b8" font-size="9">Policy Redirect</text>

  <!-- BOTTOM METRICS BAR -->
  <rect x="55" y="440" width="885" height="65" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="500" y="458" fill="white" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">KEY METRICS</text>

  <line x1="295" y1="445" x2="295" y2="500" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="505" y1="445" x2="505" y2="500" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="700" y1="445" x2="700" y2="500" stroke="#1e293b" stroke-width="0.5"/>

  <text x="175" y="480" fill="#22d3ee" font-size="13" font-weight="600" text-anchor="middle">$12.50</text>
  <text x="175" y="496" fill="#64748b" font-size="8" text-anchor="middle">Real cost (registered)</text>

  <text x="400" y="480" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">$50.00</text>
  <text x="400" y="496" fill="#64748b" font-size="8" text-anchor="middle">Daily budget (auto-reset)</text>

  <text x="600" y="480" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">84.6%</text>
  <text x="600" y="496" fill="#64748b" font-size="8" text-anchor="middle">Budget consumed today</text>

  <text x="800" y="480" fill="#fb7185" font-size="13" font-weight="600" text-anchor="middle">429</text>
  <text x="800" y="496" fill="#64748b" font-size="8" text-anchor="middle">HTTP response when blocked</text>

  <!-- Footer -->
  <text x="500" y="515" fill="#475569" font-size="8" text-anchor="middle">agent-gov Budget Enforcement · github.com/sschelliah2026-source/agent-gov · MIT License</text>
</svg>
